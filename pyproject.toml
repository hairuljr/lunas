[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "lunas"
version = "0.0.1"
description = "Accounts-payable agent that reads untrusted invoices and pays only what policy allows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.23",
    "langgraph-checkpoint-postgres>=3.2.1",
    "onnxruntime>=1.32.0",
    "openai>=3.49.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.15.2",
    "rapidocr>=3.10.0",
    "reportlab>=5.1.0",
]

[project.scripts]
lunas = "lunas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `data/` (generator) and `evals/` are scripts at the repo root, imported as `data.*` / `evals.*`.
pythonpath = ["."]
# langsmith (pulled in by langgraph) uses an asyncio API that Python 3.14 deprecates.
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["lunas", "data", "evals"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
