name: pr-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The contract index lives in Postgres with pgvector: the store tests need it. Same image
    # as compose.yaml, on the same host port, so the default LUNAS_DATABASE_URL works.
    services:
      postgres:
        image: docker.io/pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: lunas
          POSTGRES_PASSWORD: lunas
          POSTGRES_DB: lunas
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U lunas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Eval gate on recorded LLM responses (SPEC.md §9): no model is called. It replays
      # evals/recordings/ through the pipeline and fails on a regression, or when the
      # prompt, schema or dataset changed and the recordings need `--record`.
      - run: uv run python data/generate.py
      - run: uv run python -m evals.node.run --gate
      # The same for the scanned twins: replays recorded OCR and vision reads, so CI needs
      # neither the scans nor the OCR engine (ONNX may read differently on x86).
      - run: uv run python -m evals.node.scans --gate
      # Policy table and the bank-account invariant are added here with gapura (week 3).
