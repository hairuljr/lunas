# Run with `podman compose up -d` (needs a compose provider such as podman-compose).
# Both images publish arm64. Ports are published on loopback only.
# The app, MCP servers and gapura are added as they are built (see SPEC.md §10).
services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: lunas
      POSTGRES_PASSWORD: lunas
      POSTGRES_DB: lunas
    ports:
      # Host port 5433: 5432 is commonly taken by a Postgres installed on the machine.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql

  phoenix:
    image: docker.io/arizephoenix/phoenix:version-21.0.0
    environment:
      # In a container Phoenix listens on 0.0.0.0 and therefore turns authentication on,
      # which rejects OTLP exports without an API key (401). Local development runs without
      # it, so the port below is published on loopback only. A deployment that is reachable
      # from outside must drop this line and send an API key instead.
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "127.0.0.1:6006:6006"

volumes:
  pgdata:
